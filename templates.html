<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>PowerPoint Templates | Wisdom Tech</title>
    <link rel="icon" type="image/png" href="unnamed (1).png">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --transition-theme: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        [data-theme="dark"] {
            --bg: #04060f;
            --bg-panel: #0b0f1e;
            --bg-card: #0e1526;
            --primary: #4f6ef7;
            --secondary: #7c3aed;
            --accent: #00d4ff;
            --accent2: #f43f5e;
            --border: rgba(255, 255, 255, 0.07);
            --border-hover: rgba(0, 212, 255, 0.4);
            --text: #e8edf5;
            --text-muted: #64748b;
            --text-soft: #94a3b8;
            --nav-bg: rgba(4, 6, 15, 0.88);
            --card-shadow: 0 8px 32px rgba(0,0,0,0.4);
            --card-shadow-hover: 0 24px 60px rgba(79,110,247,0.18);
            --tag-bg: rgba(0, 212, 255, 0.08);
            --tag-color: #00d4ff;
        }

        [data-theme="light"] {
            --bg: #f0f4ff;
            --bg-panel: #e4eaf8;
            --bg-card: #ffffff;
            --primary: #4f6ef7;
            --secondary: #7c3aed;
            --accent: #0077cc;
            --accent2: #e11d48;
            --border: rgba(79, 110, 247, 0.12);
            --border-hover: rgba(79, 110, 247, 0.5);
            --text: #0f172a;
            --text-muted: #475569;
            --text-soft: #64748b;
            --nav-bg: rgba(240, 244, 255, 0.92);
            --card-shadow: 0 4px 24px rgba(79,110,247,0.1);
            --card-shadow-hover: 0 24px 60px rgba(79,110,247,0.22);
            --tag-bg: rgba(79, 110, 247, 0.08);
            --tag-color: #4f6ef7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        img { max-width: 100%; height: auto; display: block; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            font-size: 16px;
            line-height: 1.65;
            overflow-x: hidden;
            transition: var(--transition-theme);
            min-height: 100vh;
        }

        #spider-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .container { width: 92%; max-width: 1160px; margin: auto; }

        nav {
            position: sticky; top: 0; z-index: 1000;
            background: var(--nav-bg);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            transition: var(--transition-theme);
        }

        .nav-inner { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; gap: 16px; }

        .logo-link { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--text); text-decoration: none; letter-spacing: -0.5px; }
        .logo-link span { color: var(--accent); }

        .nav-right { display: flex; align-items: center; gap: 14px; }

        .back-link { display: flex; align-items: center; gap: 7px; color: var(--text-muted); text-decoration: none; font-size: 0.88rem; font-weight: 500; transition: color 0.3s; }
        .back-link:hover { color: var(--accent); }

        .theme-toggle {
            width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border);
            background: transparent; color: var(--text-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: all 0.3s;
        }
        .theme-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--tag-bg); }

        .page-hero { position: relative; z-index: 1; padding: 80px 20px 60px; text-align: center; }

        .logo-orbit { position: relative; width: 160px; height: 160px; margin: 0 auto 36px; }
        .logo-ring { position: absolute; inset: -10px; border-radius: 50%; border: 1px dashed var(--border-hover); animation: spin 14s linear infinite; }
        .logo-ring::before { content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%); width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

        .logo-img-wrap { width: 160px; height: 160px; border-radius: 50%; overflow: hidden; border: 3px solid var(--accent); box-shadow: 0 0 0 6px var(--tag-bg), 0 0 50px rgba(0,212,255,0.2); animation: floatY 4s ease-in-out infinite; }
        .logo-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

        .page-hero h1 { font-family: 'Syne', sans-serif; font-size: clamp(2.2rem, 5vw, 3.8rem); font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 14px; color: var(--text); }
        .page-hero h1 .highlight { background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .page-hero p { color: var(--text-soft); font-size: 1.05rem; max-width: 520px; margin: 0 auto; }

        .count-pill { display: inline-flex; align-items: center; gap: 7px; margin-top: 22px; padding: 7px 18px; border-radius: 100px; border: 1px solid var(--border); background: var(--tag-bg); font-size: 0.82rem; color: var(--tag-color); font-weight: 600; }

        .projects-section { position: relative; z-index: 1; padding: 0 0 80px; }

        /* Filter tabs */
        .filter-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 40px; }
        .filter-btn {
            background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-muted);
            padding: 9px 20px; border-radius: 100px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
            font-family: 'DM Sans', sans-serif; transition: all 0.25s;
        }
        .filter-btn.active, .filter-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px; }

        .project-card {
            display: block; width: 100%; text-align: left; text-decoration: none; color: inherit;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
            overflow: hidden; box-shadow: var(--card-shadow); cursor: pointer; padding: 0; font-family: inherit;
            transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
            position: relative; animation: fadeSlideUp 0.5s ease both;
        }
        .project-card.hidden { display: none; }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
        .project-card:nth-child(1) { animation-delay: 0.05s; }
        .project-card:nth-child(2) { animation-delay: 0.12s; }
        .project-card:nth-child(3) { animation-delay: 0.19s; }
        .project-card:nth-child(4) { animation-delay: 0.26s; }
        .project-card:hover { transform: translateY(-7px); box-shadow: var(--card-shadow-hover); border-color: var(--border-hover); }

        .project-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--primary), var(--accent)); opacity: 0; transition: opacity 0.35s; z-index: 2; }
        .project-card:hover::before { opacity: 1; }

        .card-thumb {
            height: 190px; overflow: hidden; position: relative;
            display: flex; align-items: center; justify-content: center;
            font-size: 3.2rem;
        }
        .card-thumb::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px); background-size: 18px 18px; }
        .card-thumb i { position: relative; z-index: 1; color: rgba(255,255,255,0.92); }
        .card-thumb img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; }

        .price-badge {
            position: absolute; top: 12px; right: 12px; z-index: 2;
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.3px;
            padding: 6px 12px; border-radius: 100px; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
            display: flex; align-items: center; gap: 5px;
        }
        .price-badge.is-free { background: rgba(34, 197, 94, 0.18); border: 1px solid rgba(34, 197, 94, 0.4); color: #22c55e; }
        .price-badge.is-paid { background: rgba(244, 63, 94, 0.18); border: 1px solid rgba(244, 63, 94, 0.4); color: var(--accent2); }

        .card-body { padding: 22px 24px 24px; }

        .card-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .card-type { font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }

        .card-title { font-family: 'Syne', sans-serif; font-size: 1.12rem; font-weight: 700; color: var(--text); margin-bottom: 8px; letter-spacing: -0.3px; }
        .card-desc { font-size: 0.87rem; color: var(--text-soft); margin-bottom: 18px; line-height: 1.6; }

        .card-footer { display: flex; align-items: center; justify-content: space-between; }

        .visit-tag { display: inline-flex; align-items: center; gap: 7px; font-size: 0.82rem; font-weight: 700; color: var(--tag-color); background: var(--tag-bg); padding: 7px 14px; border-radius: 100px; border: 1px solid var(--border); transition: all 0.3s; }
        .project-card:hover .visit-tag { background: var(--primary); color: #fff; border-color: var(--primary); }
        .visit-tag.locked { color: var(--accent2); background: rgba(244, 63, 94, 0.08); }
        .project-card:hover .visit-tag.locked { background: var(--accent2); color: #fff; border-color: var(--accent2); }
        .visit-tag i { font-size: 0.7rem; transition: transform 0.3s; }
        .visit-tag img { width: 12px; height: 12px; object-fit: contain; transition: transform 0.3s; }
        .project-card:hover .visit-tag i,
        .project-card:hover .visit-tag img { transform: translate(2px, -2px); }

        .card-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--tag-bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.9rem; }

        /* Empty-state / placeholder note */
        .notice-box {
            max-width: 640px; margin: 0 auto 40px; text-align: center;
            padding: 18px 24px; border: 1px dashed var(--border-hover);
            border-radius: 16px; background: var(--tag-bg); color: var(--text-soft); font-size: 0.9rem;
        }
        .notice-box i { color: var(--accent); margin-right: 6px; }

        footer { position: relative; z-index: 1; border-top: 1px solid var(--border); padding: 32px 0; }
        .footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
        .footer-copy { font-size: 0.85rem; color: var(--text-muted); }
        .footer-copy span { color: var(--accent); }
        .footer-links { display: flex; gap: 16px; }
        .footer-links a { color: var(--text-muted); font-size: 1rem; transition: color 0.3s; text-decoration: none; }
        .footer-links a:hover { color: var(--accent); }

        @media (max-width: 768px) {
            .page-hero { padding: 56px 16px 44px; }
            .page-hero h1 { font-size: 2rem; }
            .logo-orbit, .logo-img-wrap { width: 120px; height: 120px; }
            .projects-grid { grid-template-columns: 1fr; gap: 20px; }
            .footer-inner { flex-direction: column; text-align: center; }
        }
        @media (max-width: 480px) {
            .nav-inner { padding: 12px 0; }
            .logo-link { font-size: 1.1rem; }
            .back-link span { display: none; }
        }
    </style>
</head>
<body>

    <canvas id="spider-canvas"></canvas>

    <nav>

            <!--
                HOW TO ADD A NEW TEMPLATE:

                   - PAID: set data-price to the amount shown on the badge (e.g. "GHS 25"). There's no

                3. Replace the icon + gradient in .card-thumb with a screenshot <img> if you have one.
                4. Update the title, category tag, and description.

            -->

    <script>
        const html = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        const savedTheme = localStorage.getItem('wt-theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);
        updateIcon(savedTheme);

        document.getElementById('themeToggle').addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('wt-theme', next);
            updateIcon(next);
        });

        function updateIcon(theme) {
            themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        const templateCards = document.querySelectorAll('#templateContainer .project-card');
        document.getElementById('templateCount').textContent = templateCards.length;

        /* Filtering */
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.getAttribute('data-filter');
                templateCards.forEach(card => {
                    const match = filter === 'all' || card.getAttribute('data-access') === filter;
                    card.classList.toggle('hidden', !match);
                });
            });
        });

        /* Download (free) / Buy via WhatsApp (paid) */
        const WHATSAPP_NUMBER = '233595232383';
        templateCards.forEach(card => {
            card.addEventListener('click', () => {
                const access = card.getAttribute('data-access');
                const title = card.getAttribute('data-title') || 'this template';

                if (access === 'paid') {
                    const price = card.getAttribute('data-price') || '';
                    const msg = `Hi! I'd like to buy the "${title}" PowerPoint template${price ? ' (' + price + ')' : ''}.`;
                    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
                    return;
                }

                const file = card.getAttribute('data-file');
                if (file) {
                    const link = document.createElement('a');
                    link.href = file;
                    link.download = '';
                    link.rel = 'noopener';
                    link.target = '_blank';
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                } else {
                    const msg = `Hi! Could I get the "${title}" PowerPoint template? It's not uploaded on the site yet.`;
                    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
                }
            });
        });

        const canvas = document.getElementById('spider-canvas');
        const ctx = canvas.getContext('2d');
        let W, H, nodes = [], mouse = { x: -9999, y: -9999 };
        const NODE_COUNT = 80, MAX_DIST = 130, MOUSE_DIST = 160;

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        function createNodes() {
            nodes = [];
            for (let i = 0; i < NODE_COUNT; i++) {
                nodes.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, r: Math.random() * 2 + 1 });
            }
        }
        function getThemeColors() {
            const isDark = html.getAttribute('data-theme') === 'dark';
            return {
                line: isDark ? 'rgba(0, 212, 255, 0.15)' : 'rgba(79, 110, 247, 0.13)',
                dot:  isDark ? 'rgba(0, 212, 255, 0.65)' : 'rgba(79, 110, 247, 0.55)',
                mouse: isDark ? 'rgba(244, 63, 94, 0.22)' : 'rgba(244, 63, 94, 0.18)',
                mouseDot: isDark ? 'rgba(244, 63, 94, 0.8)' : 'rgba(244, 63, 94, 0.7)'
            };
        }
        function draw() {
            ctx.clearRect(0, 0, W, H);
            const c = getThemeColors();
            nodes.forEach(n => {
                n.x += n.vx; n.y += n.vy;
                if (n.x < 0 || n.x > W) n.vx *= -1;
                if (n.y < 0 || n.y > H) n.vy *= -1;
            });
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < MAX_DIST) {
                        ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = c.line; ctx.lineWidth = 0.6; ctx.globalAlpha = 1 - dist / MAX_DIST; ctx.stroke(); ctx.globalAlpha = 1;
                    }
                }
                const mx = nodes[i].x - mouse.x, my = nodes[i].y - mouse.y;
                const md = Math.sqrt(mx * mx + my * my);
                if (md < MOUSE_DIST) {
                    ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(mouse.x, mouse.y);
                    ctx.strokeStyle = c.mouse; ctx.lineWidth = 0.8; ctx.globalAlpha = 1 - md / MOUSE_DIST; ctx.stroke(); ctx.globalAlpha = 1;
                }
            }
            nodes.forEach(n => {
                const mx = n.x - mouse.x, my = n.y - mouse.y;
                const md = Math.sqrt(mx * mx + my * my);
                const isNearMouse = md < MOUSE_DIST;
                ctx.beginPath(); ctx.arc(n.x, n.y, isNearMouse ? n.r * 1.6 : n.r, 0, Math.PI * 2);
                ctx.fillStyle = isNearMouse ? c.mouseDot : c.dot; ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, { passive: true });
        window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
        window.addEventListener('resize', () => { resize(); createNodes(); });
        resize(); createNodes(); draw();
    </script>
</body>
</html>
