<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Flyers, Logos & Posters | Wisdom Tech</title>
    <link rel="icon" type="image/png" href="unnamed (1).png">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root { --transition-theme: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease; }

        [data-theme="dark"] {
            --bg: #04060f; --bg-panel: #0b0f1e; --bg-card: #0e1526;
            --primary: #4f6ef7; --secondary: #7c3aed; --accent: #00d4ff; --accent2: #f43f5e;
            --border: rgba(255, 255, 255, 0.07); --border-hover: rgba(0, 212, 255, 0.4);
            --text: #e8edf5; --text-muted: #64748b; --text-soft: #94a3b8;
            --nav-bg: rgba(4, 6, 15, 0.88);
            --card-shadow: 0 8px 32px rgba(0,0,0,0.4); --card-shadow-hover: 0 24px 60px rgba(79,110,247,0.18);
            --tag-bg: rgba(0, 212, 255, 0.08); --tag-color: #00d4ff;
        }
        [data-theme="light"] {
            --bg: #f0f4ff; --bg-panel: #e4eaf8; --bg-card: #ffffff;
            --primary: #4f6ef7; --secondary: #7c3aed; --accent: #0077cc; --accent2: #e11d48;
            --border: rgba(79, 110, 247, 0.12); --border-hover: rgba(79, 110, 247, 0.5);
            --text: #0f172a; --text-muted: #475569; --text-soft: #64748b;
            --nav-bg: rgba(240, 244, 255, 0.92);
            --card-shadow: 0 4px 24px rgba(79,110,247,0.1); --card-shadow-hover: 0 24px 60px rgba(79,110,247,0.22);
            --tag-bg: rgba(79, 110, 247, 0.08); --tag-color: #4f6ef7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'DM Sans', sans-serif; background-color: var(--bg); color: var(--text); font-size: 16px; line-height: 1.65; overflow-x: hidden; transition: var(--transition-theme); min-height: 100vh; }

        #spider-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .container { width: 92%; max-width: 1160px; margin: auto; }

        nav { position: sticky; top: 0; z-index: 1000; background: var(--nav-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); transition: var(--transition-theme); }
        .nav-inner { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; gap: 16px; }
        .logo-link { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--text); text-decoration: none; letter-spacing: -0.5px; }
        .logo-link span { color: var(--accent); }
        .nav-right { display: flex; align-items: center; gap: 14px; }
        .back-link { display: flex; align-items: center; gap: 7px; color: var(--text-muted); text-decoration: none; font-size: 0.88rem; font-weight: 500; transition: color 0.3s; }
        .back-link:hover { color: var(--accent); }
        .theme-toggle { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: all 0.3s; }
        .theme-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--tag-bg); }

        .page-hero { position: relative; z-index: 1; padding: 80px 20px 60px; text-align: center; }
        .logo-orbit { position: relative; width: 160px; height: 160px; margin: 0 auto 36px; }
        .logo-ring { position: absolute; inset: -10px; border-radius: 50%; border: 1px dashed var(--border-hover); animation: spin 14s linear infinite; }
        .logo-ring::before { content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%); width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
        .logo-img-wrap { width: 160px; height: 160px; border-radius: 50%; overflow: hidden; border: 3px solid var(--accent); box-shadow: 0 0 0 6px var(--tag-bg), 0 0 50px rgba(0,212,255,0.2); animation: floatY 4s ease-in-out infinite; }
        .logo-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .page-hero h1 { font-family: 'Syne', sans-serif; font-size: clamp(2.2rem, 5vw, 3.8rem); font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 14px; color: var(--text); }
        .page-hero h1 .highlight { background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .page-hero p { color: var(--text-soft); font-size: 1.05rem; max-width: 520px; margin: 0 auto; }
        .count-pill { display: inline-flex; align-items: center; gap: 7px; margin-top: 22px; padding: 7px 18px; border-radius: 100px; border: 1px solid var(--border); background: var(--tag-bg); font-size: 0.82rem; color: var(--tag-color); font-weight: 600; }

        .projects-section { position: relative; z-index: 1; padding: 0 0 80px; }

        /* Filter tabs */
        .filter-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 40px; }
        .filter-btn {
            background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-muted);
            padding: 9px 20px; border-radius: 100px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
            font-family: 'DM Sans', sans-serif; transition: all 0.25s;
        }
        .filter-btn.active, .filter-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

        .design-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }

        .design-card {
            display: block; width: 100%; text-align: left; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 18px; overflow: hidden; box-shadow: var(--card-shadow); cursor: pointer; padding: 0;
            transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
            position: relative; animation: fadeSlideUp 0.5s ease both; font-family: inherit; color: inherit;
        }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
        .design-card.hidden { display: none; }
        .design-card:hover { transform: translateY(-6px); box-shadow: var(--card-shadow-hover); border-color: var(--border-hover); }
        .design-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--primary), var(--accent)); opacity: 0; transition: opacity 0.35s; z-index: 2; }
        .design-card:hover::before { opacity: 1; }

        .design-thumb { height: 220px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; font-size: 2.6rem; }
        .design-thumb::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px); background-size: 18px 18px; }
        .design-thumb i { position: relative; z-index: 1; color: rgba(255,255,255,0.9); }
        .design-thumb img { width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 1; }

        .zoom-badge {
            position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 10px;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.8rem; z-index: 2;
        }

        .design-body { padding: 16px 18px 20px; }
        .design-tag { font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--tag-color); margin-bottom: 6px; display: inline-block; }
        .design-title { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; color: var(--text); }

        .notice-box { max-width: 640px; margin: 0 auto 40px; text-align: center; padding: 18px 24px; border: 1px dashed var(--border-hover); border-radius: 16px; background: var(--tag-bg); color: var(--text-soft); font-size: 0.9rem; }
        .notice-box i { color: var(--accent); margin-right: 6px; }

        /* Lightbox */
        .lightbox { position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.88); display: none; align-items: center; justify-content: center; padding: 24px; backdrop-filter: blur(6px); }
        .lightbox.open { display: flex; }
        .lightbox-inner { max-width: 90vw; max-height: 88vh; position: relative; }
        .lightbox-inner img { max-width: 90vw; max-height: 88vh; border-radius: 12px; display: block; box-shadow: 0 30px 90px rgba(0,0,0,0.6); }
        .lightbox-close { position: absolute; top: -18px; right: -18px; width: 40px; height: 40px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
        .lightbox-close:hover { background: var(--accent2); border-color: var(--accent2); color: #fff; }
        .lightbox-caption { text-align: center; color: #fff; margin-top: 14px; font-size: 0.9rem; opacity: 0.85; }

        footer { position: relative; z-index: 1; border-top: 1px solid var(--border); padding: 32px 0; }
        .footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
        .footer-copy { font-size: 0.85rem; color: var(--text-muted); }
        .footer-copy span { color: var(--accent); }
        .footer-links { display: flex; gap: 16px; }
        .footer-links a { color: var(--text-muted); font-size: 1rem; transition: color 0.3s; text-decoration: none; }
        .footer-links a:hover { color: var(--accent); }

        @media (max-width: 768px) {
            .page-hero { padding: 56px 16px 44px; }
            .page-hero h1 { font-size: 2rem; }
            .logo-orbit, .logo-img-wrap { width: 120px; height: 120px; }
            .design-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
            .footer-inner { flex-direction: column; text-align: center; }
        }
        @media (max-width: 480px) {
            .nav-inner { padding: 12px 0; }
            .logo-link { font-size: 1.1rem; }
            .back-link span { display: none; }
            .design-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <canvas id="spider-canvas"></canvas>

    <nav>
        <div class="container">
            <div class="nav-inner">
                <a href="index.html" class="logo-link">WISDOM <span>TECH</span></a>
                <div class="nav-right">
                    <a href="index.html" class="back-link">
                        <i class="fas fa-arrow-left"></i>
                        <span>Back to Home</span>
                    </a>
                    <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
                        <i class="fas fa-moon" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="page-hero">
        <div class="logo-orbit">
            <div class="logo-ring"></div>
            <div class="logo-img-wrap">
                <img src="Gemini_Generated_Image_tbbnt1tbbnt1tbbn.png" alt="Wisdom Tech Logo">
            </div>
        </div>
        <h1>Flyers, Logos <span class="highlight">&amp; Posters</span></h1>
        <p>A gallery of graphic design work — click any piece to view it full size.</p>
        <div class="count-pill">
            <i class="fas fa-palette"></i>
            <span id="designCount">0</span> Designs
        </div>
    </div>

    <section class="projects-section">
        <div class="container">

            <!--
                HOW TO ADD A NEW DESIGN:
                1. Duplicate one <button class="design-card" data-category="..."> block below.
                   data-category must be one of: flyers, logos, posters
                2. Replace the icon/gradient in .design-thumb with a real <img src="your-file.jpg" alt="..."> once you have one.
                3. Set data-full to the full-size image path (used by the lightbox) if different from the thumbnail.
                4. Update design-tag and design-title text.
                5. Bump the number in #designCount above.
            -->

            <div class="notice-box reveal">
                <i class="fas fa-circle-info"></i>
                Designs are being uploaded soon — check back shortly to browse the full gallery.
            </div>

            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="flyers">Flyers</button>
                <button class="filter-btn" data-filter="logos">Logos</button>
                <button class="filter-btn" data-filter="posters">Posters</button>
            </div>

            <div class="design-grid" id="designContainer">

                <!-- Sample Slot 1 -->
                <button class="design-card" data-category="flyers" data-full="designs/Sports.png" data-title="Sports Flyer">
                    <div class="design-thumb">
                        <img src="designs/Sports.png" alt="Sports Flyer">
                        <span class="zoom-badge"><i class="fas fa-magnifying-glass-plus"></i></span>
                    </div>
                    <div class="design-body">
                        <span class="design-tag">Flyer</span>
                        <h3 class="design-title">Sports Flyer</h3>
                    </div>
                </button>


                <!-- Sample Slot 2 -->
                <button class="design-card" data-category="logos" data-full="" data-title="Minimalist Logo Mark">
                    <div class="design-thumb" style="background: linear-gradient(135deg, #22c55e, #063d20);">
                        <i class="fas fa-shapes"></i>
                        <span class="zoom-badge"><i class="fas fa-magnifying-glass-plus"></i></span>
                    </div>
                    <div class="design-body">
                        <span class="design-tag">Logo</span>
                        <h3 class="design-title">Minimalist Logo Mark</h3>
                    </div>
                </button>

                <!-- Sample Slot 3 -->
                <button class="design-card" data-category="posters" data-full="" data-title="Concert Poster Design">
                    <div class="design-thumb" style="background: linear-gradient(135deg, #7c3aed, #29104a);">
                        <i class="fas fa-image"></i>
                        <span class="zoom-badge"><i class="fas fa-magnifying-glass-plus"></i></span>
                    </div>
                    <div class="design-body">
                        <span class="design-tag">Poster</span>
                        <h3 class="design-title">Concert Poster Design</h3>
                    </div>
                </button>

                <!-- Sample Slot 4 -->
                <button class="design-card" data-category="logos" data-full="" data-title="Brand Wordmark">
                    <div class="design-thumb" style="background: linear-gradient(135deg, #0ea5e9, #063049);">
                        <i class="fas fa-signature"></i>
                        <span class="zoom-badge"><i class="fas fa-magnifying-glass-plus"></i></span>
                    </div>
                    <div class="design-body">
                        <span class="design-tag">Logo</span>
                        <h3 class="design-title">Brand Wordmark</h3>
                    </div>
                </button>

            </div>
        </div>
    </section>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-inner">
            <button class="lightbox-close" id="lightboxClose"><i class="fas fa-xmark"></i></button>
            <div id="lightboxBody"></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-inner">
                <p class="footer-copy">&copy; 2026 <span>Wisdom Ahiadeke Computing</span>. All rights reserved.</p>
                <div class="footer-links">
                    <a href="https://github.com/WizzyB010" aria-label="GitHub" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i></a>
                    <a href="https://www.linkedin.com/in/wisdom-ahiadeke-b1a957280/" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer"><i class="fab fa-linkedin"></i></a>
                    <a href="https://www.instagram.com/wizzyboy010_" aria-label="Instagram" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const html = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        const savedTheme = localStorage.getItem('wt-theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);
        updateIcon(savedTheme);

        document.getElementById('themeToggle').addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('wt-theme', next);
            updateIcon(next);
        });
        function updateIcon(theme) { themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon'; }

        const designCards = document.querySelectorAll('#designContainer .design-card');
        document.getElementById('designCount').textContent = designCards.length;

        /* Filtering */
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.getAttribute('data-filter');
                designCards.forEach(card => {
                    const match = filter === 'all' || card.getAttribute('data-category') === filter;
                    card.classList.toggle('hidden', !match);
                });
            });
        });

        /* Lightbox */
        const lightbox = document.getElementById('lightbox');
        const lightboxBody = document.getElementById('lightboxBody');
        const lightboxClose = document.getElementById('lightboxClose');

        designCards.forEach(card => {
            card.addEventListener('click', () => {
                const full = card.getAttribute('data-full');
                const title = card.getAttribute('data-title') || 'Design';
                if (full) {
                    lightboxBody.innerHTML = `<img src="${full}" alt="${title}"><div class="lightbox-caption">${title}</div>`;
                } else {
                    lightboxBody.innerHTML = `<div class="lightbox-caption" style="font-size:1rem; padding:40px;">${title} — full image coming soon.</div>`;
                }
                lightbox.classList.add('open');
            });
        });

        function closeLightbox() {
            lightbox.classList.remove('open');
            lightboxBody.innerHTML = '';
        }
        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

        const canvas = document.getElementById('spider-canvas');
        const ctx = canvas.getContext('2d');
        let W, H, nodes = [], mouse = { x: -9999, y: -9999 };
        const NODE_COUNT = 80, MAX_DIST = 130, MOUSE_DIST = 160;

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        function createNodes() {
            nodes = [];
            for (let i = 0; i < NODE_COUNT; i++) {
                nodes.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, r: Math.random() * 2 + 1 });
            }
        }
        function getThemeColors() {
            const isDark = html.getAttribute('data-theme') === 'dark';
            return {
                line: isDark ? 'rgba(0, 212, 255, 0.15)' : 'rgba(79, 110, 247, 0.13)',
                dot:  isDark ? 'rgba(0, 212, 255, 0.65)' : 'rgba(79, 110, 247, 0.55)',
                mouse: isDark ? 'rgba(244, 63, 94, 0.22)' : 'rgba(244, 63, 94, 0.18)',
                mouseDot: isDark ? 'rgba(244, 63, 94, 0.8)' : 'rgba(244, 63, 94, 0.7)'
            };
        }
        function draw() {
            ctx.clearRect(0, 0, W, H);
            const c = getThemeColors();
            nodes.forEach(n => {
                n.x += n.vx; n.y += n.vy;
                if (n.x < 0 || n.x > W) n.vx *= -1;
                if (n.y < 0 || n.y > H) n.vy *= -1;
            });
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < MAX_DIST) {
                        ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = c.line; ctx.lineWidth = 0.6; ctx.globalAlpha = 1 - dist / MAX_DIST; ctx.stroke(); ctx.globalAlpha = 1;
                    }
                }
                const mx = nodes[i].x - mouse.x, my = nodes[i].y - mouse.y;
                const md = Math.sqrt(mx * mx + my * my);
                if (md < MOUSE_DIST) {
                    ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(mouse.x, mouse.y);
                    ctx.strokeStyle = c.mouse; ctx.lineWidth = 0.8; ctx.globalAlpha = 1 - md / MOUSE_DIST; ctx.stroke(); ctx.globalAlpha = 1;
                }
            }
            nodes.forEach(n => {
                const mx = n.x - mouse.x, my = n.y - mouse.y;
                const md = Math.sqrt(mx * mx + my * my);
                const isNearMouse = md < MOUSE_DIST;
                ctx.beginPath(); ctx.arc(n.x, n.y, isNearMouse ? n.r * 1.6 : n.r, 0, Math.PI * 2);
                ctx.fillStyle = isNearMouse ? c.mouseDot : c.dot; ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, { passive: true });
        window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
        window.addEventListener('resize', () => { resize(); createNodes(); });
        resize(); createNodes(); draw();
    </script>
</body>
</html>
